<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Toolora - Professional Photo Editor</title>
<link rel="stylesheet" href="css/photo-editor.css">
</head>

<body>
<div class="app">

<header class="topbar">
  <a class="brand" href="index.html">Toolora</a>

  <div class="actions">
    <label class="topbtn" title="Open photo">
      ⇧
      <input id="fileInput" type="file" accept="image/*">
    </label>

    <button class="topbtn" id="undo" title="Undo">↶</button>
    <button class="topbtn" id="redo" title="Redo">↷</button>
    <button class="topbtn" id="before" title="Before / After">◉</button>

    <a class="back" href="index.html">Back</a>
  </div>
</header>

<main class="workspace">

<section class="viewer">

  <div class="viewerbar">
    <div>
      <b id="name">No photo</b>
      <small id="meta">Open an image to start</small>
    </div>

    <div class="zoom">
      <button id="zout">−</button>
      <span id="zlabel">Fit</span>
      <button id="zin">+</button>
      <button id="fit">Fit</button>
      <button id="full">⛶</button>
    </div>
  </div>

  <div id="stage" class="stage">

    <div id="empty" class="empty">
      <div class="spark">✦</div>
      <h2>Professional Photo Editor</h2>
      <p>
        Local browser editing. Your photo stays on this device.
      </p>

      <label class="openbtn">
        Open Photo
        <input id="emptyInput" type="file" accept="image/*">
      </label>
    </div>

    <canvas id="canvas"></canvas>
    <canvas id="overlay"></canvas>

    <span id="badge">Before</span>
  </div>

  <div class="status">
    <span id="status">Ready</span>
    <span>Local processing</span>
  </div>

</section>

<aside class="editor">

  <div class="panelhead">
    <div>
      <small id="eyebrow">Adjust</small>
      <h2 id="title">Light</h2>
    </div>

    <button id="reset" class="reset">Reset</button>
  </div>

  <div id="panel" class="panel"></div>

  <nav class="tabs" id="tabs">

    <button data-tool="light">
      ☼
      <span>Light</span>
    </button>

    <button data-tool="color">
      ◐
      <span>Color</span>
    </button>

    <button data-tool="effects">
      ✧
      <span>Effects</span>
    </button>

    <button data-tool="detail">
      ◒
      <span>Detail</span>
    </button>

    <button data-tool="crop">
      ⌗
      <span>Crop</span>
    </button>

    <button data-tool="presets">
      ★
      <span>Presets</span>
    </button>

    <button data-tool="profiles">
      ◈
      <span>Profiles</span>
    </button>

    <button data-tool="mask">
      ◌
      <span>Mask</span>
    </button>

    <button data-tool="retouch">
      ⌫
      <span>Retouch</span>
    </button>

    <button data-tool="blur">
      ◍
      <span>Blur</span>
    </button>

    <button data-tool="optics">
      ◎
      <span>Optics</span>
    </button>

    <button data-tool="export">
      ⇩
      <span>Export</span>
    </button>

  </nav>

</aside>

</main>

<script src="js/photo-editor.js"></script>
</body>
</html>
