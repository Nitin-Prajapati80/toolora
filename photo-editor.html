<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Toolora Photo Editor</title>

    <link
        rel="stylesheet"
        href="css/photo-editor.css"
    >
</head>

<body>

<div class="editor-app">

    <!-- TOP BAR -->
    <header class="topbar">

        <div class="brand">
            <a href="index.html">Toolora</a>
        </div>

        <div class="top-actions">

            <button
                type="button"
                id="openPhotoBtn"
                class="top-button primary"
            >
                Open Photo
            </button>

            <button
                type="button"
                id="undoBtn"
                class="top-button"
                title="Undo"
            >
                Undo
            </button>

            <button
                type="button"
                id="redoBtn"
                class="top-button"
                title="Redo"
            >
                Redo
            </button>

            <button
                type="button"
                id="beforeBtn"
                class="top-button"
            >
                Before
            </button>

            <a
                href="index.html"
                class="top-button back-button"
            >
                Back
            </a>

        </div>

    </header>


    <!-- MAIN WORKSPACE -->
    <main class="workspace">

        <!-- PHOTO AREA -->
        <section class="preview-area">

            <div class="preview-toolbar">

                <div>
                    <span id="photoName">
                        No photo selected
                    </span>

                    <span
                        id="photoSize"
                        class="photo-size"
                    ></span>
                </div>

                <div class="preview-actions">

                    <button
                        type="button"
                        id="zoomOutBtn"
                    >
                        −
                    </button>

                    <span id="zoomValue">
                        Fit
                    </span>

                    <button
                        type="button"
                        id="zoomInBtn"
                    >
                        +
                    </button>

                    <button
                        type="button"
                        id="fitBtn"
                    >
                        Fit
                    </button>

                </div>

            </div>


            <!-- FIXED PHOTO VIEW -->
            <div
                id="photoStage"
                class="photo-stage"
            >

                <div
                    id="emptyState"
                    class="empty-state"
                >

                    <div class="empty-icon">
                        +
                    </div>

                    <h2>
                        Edit your photo
                    </h2>

                    <p>
                        Select a photo to start editing.
                    </p>

                    <button
                        type="button"
                        id="emptyOpenBtn"
                        class="open-photo-large"
                    >
                        Open Photo
                    </button>

                </div>


                <canvas
                    id="previewCanvas"
                    class="preview-canvas"
                ></canvas>

                <div
                    id="beforeLabel"
                    class="before-label"
                >
                    BEFORE
                </div>

            </div>


            <div
                id="statusBar"
                class="status-bar"
            >
                Ready
            </div>

        </section>


        <!-- EDITOR AREA -->
        <section class="editor-area">

            <!-- CONTROL PANEL -->
            <div
                id="controlPanel"
                class="control-panel"
            >

                <div class="panel-empty">
                    <h3>
                        Photo Editor
                    </h3>

                    <p>
                        Open a photo and choose an editing tool below.
                    </p>
                </div>

            </div>


            <!-- BOTTOM TOOL BAR -->
            <nav
                id="toolBar"
                class="tool-bar"
            >

                <button
                    type="button"
                    class="tool-button active"
                    data-tool="light"
                >
                    <span>☀</span>
                    <small>Light</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="color"
                >
                    <span>◉</span>
                    <small>Color</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="effects"
                >
                    <span>✦</span>
                    <small>Effects</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="detail"
                >
                    <span>◇</span>
                    <small>Detail</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="crop"
                >
                    <span>⌗</span>
                    <small>Crop</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="presets"
                >
                    <span>▦</span>
                    <small>Presets</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="mask"
                >
                    <span>◌</span>
                    <small>Mask</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="blur"
                >
                    <span>◒</span>
                    <small>Blur</small>
                </button>

                <button
                    type="button"
                    class="tool-button"
                    data-tool="export"
                >
                    <span>⇩</span>
                    <small>Export</small>
                </button>

            </nav>

        </section>

    </main>


    <!-- HIDDEN FILE INPUT -->
    <input
        id="photoInput"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
        hidden
    >

</div>


<script src="js/photo-editor.js"></script>

</body>
</html>
