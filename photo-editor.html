<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">

<title>Toolora - Professional Photo Editor</title>

<link rel="stylesheet" href="css/photo-editor.css">
</head>

<body>

<div class="app">

<header class="topbar">

  <a class="brand" href="index.html">Toolora</a>

  <div class="actions">

    <button
      class="topbtn"
      id="openTop"
      type="button"
      title="Open photo">
      Open
    </button>

    <input
      id="fileInput"
      class="file-hidden"
      type="file"
      accept="image/jpeg,image/png,image/webp,image/gif,image/avif">

    <button
      class="topbtn"
      id="undo"
      type="button"
      title="Undo">
      ↶
    </button>

    <button
      class="topbtn"
      id="redo"
      type="button"
      title="Redo">
      ↷
    </button>

    <button
      class="topbtn"
      id="before"
      type="button"
      title="Before / After">
      Before
    </button>

    <a
      class="back"
      href="index.html">
      Back
    </a>

  </div>

</header>


<main class="workspace">


<section class="viewer">

  <div class="viewerbar">

    <div>
      <b id="name">No photo</b>
      <small id="meta">Open an image to start</small>
    </div>

    <div class="zoom">

      <button id="zout" type="button">−</button>

      <span id="zlabel">100%</span>

      <button id="zin" type="button">+</button>

      <button id="fit" type="button">Fit</button>

      <button id="full" type="button">⛶</button>

    </div>

  </div>


  <div id="stage" class="stage">

    <div id="empty" class="empty">

      <div class="spark">✦</div>

      <h2>Professional Photo Editor</h2>

      <p>
        Local browser editing. Your photo stays on this device.
      </p>

      <button
        class="openbtn"
        id="openEmpty"
        type="button">
        Open Photo
      </button>

    </div>


    <canvas id="canvas"></canvas>

    <canvas id="overlay"></canvas>

    <span id="badge">Before</span>

  </div>


  <div class="status">

    <span id="status">Ready</span>

    <span>Local processing</span>

  </div>

</section>



<aside class="editor">

  <div class="panelhead">

    <div>

      <small id="eyebrow">Adjust</small>

      <h2 id="title">Light</h2>

    </div>

    <button
      id="reset"
      class="reset"
      type="button">
      Reset
    </button>

  </div>


  <div
    id="panel"
    class="panel">
  </div>


  <nav
    class="tabs"
    id="tabs"
    aria-label="Editing tools">

    <button data-tool="light" type="button">
      ☼
      <span>Light</span>
    </button>

    <button data-tool="color" type="button">
      ◐
      <span>Color</span>
    </button>

    <button data-tool="effects" type="button">
      ✧
      <span>Effects</span>
    </button>

    <button data-tool="detail" type="button">
      ◒
      <span>Detail</span>
    </button>

    <button data-tool="crop" type="button">
      ⌗
      <span>Crop</span>
    </button>

    <button data-tool="presets" type="button">
      ★
      <span>Presets</span>
    </button>

    <button data-tool="profiles" type="button">
      ◈
      <span>Profiles</span>
    </button>

    <button data-tool="mask" type="button">
      ◌
      <span>Mask</span>
    </button>

    <button data-tool="retouch" type="button">
      ⌫
      <span>Retouch</span>
    </button>

    <button data-tool="blur" type="button">
      ◍
      <span>Blur</span>
    </button>

    <button data-tool="optics" type="button">
      ◎
      <span>Optics</span>
    </button>

    <button data-tool="export" type="button">
      ⇩
      <span>Export</span>
    </button>

  </nav>

</aside>

</main>

</div>


<script src="js/photo-editor.js"></script>

</body>
</html>
