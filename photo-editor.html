<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Toolora - Professional Photo Editor</title>
<link rel="stylesheet" href="./css/photo-editor.css?v=5">
</head>

<body>
<div class="app">

  <header class="topbar">
    <a class="brand" href="index.html">Toolora</a>

    <div class="top-actions">
      <button class="top-btn" id="openTop" type="button">Open</button>
      <button class="icon-btn" id="undo" type="button" aria-label="Undo">↶</button>
      <button class="icon-btn" id="redo" type="button" aria-label="Redo">↷</button>
      <button class="top-btn" id="before" type="button">Before</button>
      <a class="back-link" href="index.html">Back</a>
    </div>

    <input id="fileInput" class="file-input" type="file" accept="image/*">
  </header>

  <main class="workspace">

    <section class="viewer">

      <div class="viewer-head">
        <div class="photo-info">
          <strong id="name">No photo</strong>
          <span id="meta">Open an image to start</span>
        </div>

        <div class="zoom-tools">
          <button id="zout" type="button">−</button>
          <span id="zlabel">100%</span>
          <button id="zin" type="button">+</button>
          <button id="fit" type="button">Fit</button>
          <button id="full" type="button" aria-label="Fullscreen">⛶</button>
        </div>
      </div>

      <div id="stage" class="stage">

        <div id="empty" class="empty-state">
          <div class="empty-icon">✦</div>
          <h1>Professional Photo Editor</h1>
          <p>Edit photos directly in your browser. Your image stays on this device.</p>
          <button id="openEmpty" class="primary-btn" type="button">Open Photo</button>
        </div>

        <canvas id="canvas"></canvas>
        <canvas id="overlay"></canvas>

        <div id="pickerBadge" class="picker-badge">
          Click a color in the photo
        </div>

        <div id="beforeBadge" class="before-badge">
          Before
        </div>

      </div>

      <div class="status-bar">
        <span id="status">Ready</span>
        <span>Local processing</span>
      </div>

    </section>

    <aside class="editor">

      <div class="panel-head">
        <div>
          <span id="eyebrow">Adjust</span>
          <h2 id="title">Light</h2>
        </div>

        <button id="reset" class="reset-btn" type="button">
          Reset
        </button>
      </div>

      <div id="panel" class="control-panel"></div>

      <nav id="tabs" class="tool-tabs" aria-label="Editing tools">

        <button data-tool="light" type="button">
          <b>☼</b>
          <span>Light</span>
        </button>

        <button data-tool="color" type="button">
          <b>◐</b>
          <span>Color</span>
        </button>

        <button data-tool="effects" type="button">
          <b>✧</b>
          <span>Effects</span>
        </button>

        <button data-tool="detail" type="button">
          <b>◒</b>
          <span>Detail</span>
        </button>

        <button data-tool="crop" type="button">
          <b>⌗</b>
          <span>Crop</span>
        </button>

        <button data-tool="text" type="button">
          <b>T</b>
          <span>Text</span>
        </button>

        <button data-tool="draw" type="button">
          <b>✎</b>
          <span>Draw</span>
        </button>

        <button data-tool="selective" type="button">
          <b>◉</b>
          <span>Color Select</span>
        </button>

        <button data-tool="presets" type="button">
          <b>★</b>
          <span>Presets</span>
        </button>

        <button data-tool="layers" type="button">
          <b>▣</b>
          <span>Layers</span>
        </button>

        <button data-tool="export" type="button">
          <b>⇩</b>
          <span>Export</span>
        </button>

      </nav>

    </aside>

  </main>

</div>

<script src="./js/photo-editor.js?v=5"></script>
</body>
</html>
