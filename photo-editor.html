<!-- FILE: index.html -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<title>Toolora Photo Editor</title>
<link rel="stylesheet" href="photo-editor.css">
</head>
<body>

<header class="topbar">
  <button id="openBtn" class="brand" aria-label="Open photo">Toolora</button>

  <div class="file-meta">
    <strong id="fileName">No photo</strong>
    <span id="fileInfo">Open an image to begin</span>
  </div>

  <div class="top-actions">
    <button id="undoBtn" class="icon-btn" title="Undo" disabled>↶</button>
    <button id="redoBtn" class="icon-btn" title="Redo" disabled>↷</button>
    <button id="beforeBtn" class="icon-btn" title="Hold to preview original">◉</button>
    <button id="exportTop" class="export-btn">Export</button>
  </div>
</header>

<main class="editor-shell">

  <section class="preview-area">

    <div id="stage" class="stage">

      <canvas id="photoCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>

      <div id="emptyState" class="empty-state">
        <div class="empty-icon">＋</div>
        <h1>Open a photo</h1>
        <p>Professional editing, directly in your browser.</p>
        <button id="openMain" class="primary">Open Photo</button>
        <p class="drop-hint">You can also drag and drop an image here.</p>
      </div>

    </div>

    <div class="zoom-bar">
      <button data-zoom="out">−</button>
      <span id="zoomLabel">100%</span>
      <button data-zoom="in">+</button>
      <button data-zoom="fit">Fit</button>
      <button data-zoom="1">1:1</button>
    </div>

  </section>

  <aside class="control-area">
    <div id="panel" class="panel"></div>
  </aside>

</main>

<nav id="toolNav" class="tool-nav" aria-label="Editing tools">

  <button data-tool="light">
    ☼
    <span>Light</span>
  </button>

  <button data-tool="color">
    ◐
    <span>Color</span>
  </button>

  <button data-tool="effects">
    ✦
    <span>Effects</span>
  </button>

  <button data-tool="detail">
    ◌
    <span>Detail</span>
  </button>

  <button data-tool="crop">
    □
    <span>Crop</span>
  </button>

  <button data-tool="heal">
    ✚
    <span>Heal</span>
  </button>

  <button data-tool="mask">
    ◉
    <span>Mask</span>
  </button>

  <button data-tool="text">
    T
    <span>Text</span>
  </button>

  <button data-tool="draw">
    ✎
    <span>Draw</span>
  </button>

  <button data-tool="blur">
    ◒
    <span>Blur</span>
  </button>

  <button data-tool="presets">
    ◆
    <span>Presets</span>
  </button>

  <button data-tool="layers">
    ▤
    <span>Layers</span>
  </button>

  <button data-tool="export">
    ⇩
    <span>Export</span>
  </button>

</nav>

<input
  id="fileInput"
  type="file"
  accept="image/jpeg,image/png,image/webp,image/avif"
  hidden
>

<div id="toast" class="toast"></div>

<script src="photo-editor.js"></script>
</body>
</html>
