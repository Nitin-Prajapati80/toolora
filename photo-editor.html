<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Toolora</title>

    css/photo-editor.css
</head>
<body>

<header class="topbar">
    <h1>Toolora</h1>

    <input type="file" id="upload" accept="image/*">

    <button id="undo">Undo</button>
    <button id="redo">Redo</button>
    <button id="compare">Before/After</button>
    <button id="download">Export</button>
</header>

<main class="layout">

    <aside class="left">

        <label>
            Brightness
            <input id="brightness" type="range" min="-100" max="100" value="0">
        </label>

        <label>
            Contrast
            <input id="contrast" type="range" min="-100" max="100" value="0">
        </label>

        <label>
            Saturation
            <input id="saturation" type="range" min="-100" max="100" value="0">
        </label>

        <button id="drawTool">Draw</button>
        <button id="textTool">Text</button>

    </aside>

    <section class="workspace">
        <canvas id="canvas"></canvas>
    </section>

</main>

js/photo-editor.jsscript>

</body>
</html>
