<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101217">
<title>Toolora Photo Editor</title>

<link rel="stylesheet" href="css/photo-editor.css">
</head>

<body>

<div class="app">

<header class="topbar">

    <a href="index.html" class="brand">
        Toolora
    </a>

    <div class="top-actions">

        <button id="openBtn">Open</button>

        <input
            id="fileInput"
            type="file"
            accept="image/*"
            hidden
        >

        <button id="undoBtn" disabled title="Undo">
            ↶
        </button>

        <button id="redoBtn" disabled title="Redo">
            ↷
        </button>

        <button id="beforeBtn" disabled>
            Before
        </button>

        <button id="exportTop" disabled>
            Export
        </button>

        <a href="index.html" class="back-btn">
            Back
        </a>

    </div>

</header>


<main class="workspace">

<section class="viewer">

    <div class="viewer-header">

        <div>
            <strong id="fileName">
                No photo
            </strong>

            <small id="imageInfo">
                Open an image to start
            </small>
        </div>

        <div class="zoom-controls">

            <button id="zoomOut">−</button>

            <span id="zoomText">
                Fit
            </span>

            <button id="zoomIn">+</button>

            <button id="fitBtn">
                Fit
            </button>

        </div>

    </div>


    <div id="stage" class="stage">

        <div id="emptyState" class="empty-state">

            <div class="empty-icon">
                ✦
            </div>

            <h2>
                Professional Photo Editor
            </h2>

            <p>
                Edit photos locally with professional controls,
                creative tools and precise adjustments.
            </p>

            <button id="openCenter" class="primary-btn">
                Open Photo
            </button>

        </div>


        <canvas id="editorCanvas"></canvas>

        <div id="selectionBox" class="selection-box hidden">
            <div class="resize-handle"></div>
        </div>

    </div>


    <div class="viewer-status">

        <span id="statusText">
            Ready
        </span>

        <span>
            Local processing
        </span>

    </div>

</section>


<aside class="editor-panel">

    <div class="panel-header">

        <div>
            <small>
                TOOLORA EDITOR
            </small>

            <h2 id="toolTitle">
                Light
            </h2>
        </div>

        <button id="resetTool">
            Reset
        </button>

    </div>


    <div id="controls" class="controls">

        <div class="empty-controls">
            Open a photo to begin.
        </div>

    </div>


    <nav id="toolTabs" class="tool-tabs">

        <button data-tool="light" class="active">
            ☼
            <span>Light</span>
        </button>

        <button data-tool="color">
            ◐
            <span>Color</span>
        </button>

        <button data-tool="target">
            ◎
            <span>Target</span>
        </button>

        <button data-tool="effects">
            ✧
            <span>Effects</span>
        </button>

        <button data-tool="detail">
            ◒
            <span>Detail</span>
        </button>

        <button data-tool="crop">
            ⌗
            <span>Crop</span>
        </button>

        <button data-tool="filters">
            ◈
            <span>Filters</span>
        </button>

        <button data-tool="draw">
            ✎
            <span>Draw</span>
        </button>

        <button data-tool="text">
            T
            <span>Text</span>
        </button>

        <button data-tool="shapes">
            ◇
            <span>Shapes</span>
        </button>

        <button data-tool="blur">
            ◍
            <span>Blur</span>
        </button>

        <button data-tool="export">
            ⇩
            <span>Export</span>
        </button>

    </nav>

</aside>

</main>

<script src="js/photo-editor.js"></script>

</body>
</html>
