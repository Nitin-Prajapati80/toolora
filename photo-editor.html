<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Toolora Professional Photo Editor</title>
<link rel="stylesheet" href="css/photo-editor.css">
</head>

<body>
<div class="app">

    <header class="topbar">
        <button id="backBtn" class="top-btn">← Back</button>

        <div class="brand">
            <strong>Toolora</strong>
            <span>Photo Editor</span>
        </div>

        <div class="top-actions">
            <button id="openBtn" class="top-btn">Open</button>
            <button id="undoBtn" class="top-btn" disabled>↶</button>
            <button id="redoBtn" class="top-btn" disabled>↷</button>
            <button id="beforeBtn" class="top-btn">Before</button>
        </div>

        <input id="fileInput" type="file" accept="image/*" hidden>
    </header>

    <main class="workspace">

        <section class="preview-area">

            <div class="canvas-stage" id="stage">
                <canvas id="imageCanvas"></canvas>
                <canvas id="overlayCanvas"></canvas>

                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">＋</div>
                    <h2>Open an image</h2>
                    <p>Upload a photo to start editing.</p>
                    <button id="openEmptyBtn" class="primary-btn">Choose Image</button>
                </div>
            </div>

            <div class="zoom-bar">
                <button id="zoomOut">−</button>
                <span id="zoomLabel">100%</span>
                <button id="zoomIn">+</button>
                <button id="fitBtn">Fit</button>
                <button id="fullBtn">1:1</button>
            </div>

            <div class="status-bar">
                <span id="imageInfo">No image</span>
                <span id="statusText">Ready</span>
            </div>
        </section>

        <section class="editor-panel">

            <nav class="tool-tabs" id="toolTabs">
                <button data-tool="light">Light</button>
                <button data-tool="color">Color</button>
                <button data-tool="effects">Effects</button>
                <button data-tool="detail">Detail</button>
                <button data-tool="crop">Crop</button>
                <button data-tool="text">Text</button>
                <button data-tool="draw">Draw</button>
                <button data-tool="selective">Color Select</button>
                <button data-tool="presets">Presets</button>
                <button data-tool="profiles">Profiles</button>
                <button data-tool="mask">Mask</button>
                <button data-tool="retouch">Retouch</button>
                <button data-tool="blur">Blur</button>
                <button data-tool="optics">Optics</button>
                <button data-tool="layers">Layers</button>
                <button data-tool="export">Export</button>
            </nav>

            <div id="controls" class="controls"></div>

        </section>
    </main>
</div>

<script src="js/photo-editor.js"></script>
</body>
</html>
