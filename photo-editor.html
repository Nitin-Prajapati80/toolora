<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toolora Photo Editor</title>
<link rel="stylesheet" href="photo-editor.css">
</head>

<body>

<header class="topbar">
  <button id="openBtn" class="icon">＋</button>

  <div class="brand">
    TOOLORA <span>PHOTO</span>
  </div>

  <div class="top-actions">
    <button id="undoBtn" class="icon" disabled>↶</button>
    <button id="redoBtn" class="icon" disabled>↷</button>
    <button id="beforeBtn" class="pill">Before</button>
    <button id="saveBtn" class="save">Save</button>
  </div>
</header>

<main class="workspace">

  <section class="stage-wrap">

    <div id="stage" class="stage">

      <canvas id="canvas"></canvas>
      <canvas id="overlay"></canvas>

      <div id="empty" class="empty">
        <div class="empty-icon">＋</div>
        <h2>Open a photo</h2>
        <p>Choose an image to start editing</p>
        <button id="openMain">Open Photo</button>
      </div>

    </div>

    <div class="zoombar">
      <button data-zoom="out">−</button>
      <span id="zoomLabel">100%</span>
      <button data-zoom="in">＋</button>
      <button data-zoom="fit">Fit</button>
    </div>

  </section>

  <aside class="controls">
    <div id="panel" class="panel"></div>
  </aside>

</main>

<nav id="tools" class="tools">

  <button data-tool="light">
    ☼
    <span>Light</span>
  </button>

  <button data-tool="color">
    ◉
    <span>Color</span>
  </button>

  <button data-tool="effects">
    ✦
    <span>Effects</span>
  </button>

  <button data-tool="detail">
    ◌
    <span>Detail</span>
  </button>

  <button data-tool="crop">
    □
    <span>Crop</span>
  </button>

  <button data-tool="heal">
    ✚
    <span>Heal</span>
  </button>

  <button data-tool="mask">
    ◉
    <span>Mask</span>
  </button>

  <button data-tool="text">
    T
    <span>Text</span>
  </button>

  <button data-tool="draw">
    ✎
    <span>Draw</span>
  </button>

  <button data-tool="blur">
    ◒
    <span>Blur</span>
  </button>

  <button data-tool="layers">
    ▤
    <span>Layers</span>
  </button>

  <button data-tool="export">
    ⇩
    <span>Export</span>
  </button>

</nav>

<input
  id="fileInput"
  type="file"
  accept="image/jpeg,image/png,image/webp"
  hidden
>

<div id="toast" class="toast"></div>

<script src="photo-editor.js"></script>

</body>
</html>
